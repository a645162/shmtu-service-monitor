version: "3.8"

services:
  shmtu-service-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shmtu-service-monitor
    ports:
      - "3100:3100"
    environment:
      - MONITOR_PORT=3100
      - DATABASE_URL=sqlite:/data/shmtu_monitor.db?mode=rwc
      - POLL_INTERVAL_SECS=10
      - RUST_LOG=info
    volumes:
      - monitor-data:/data

volumes:
  monitor-data:
